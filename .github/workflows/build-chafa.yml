name: Build Multi-Architecture Binaries

on:
  workflow_dispatch:
    inputs:
      chafa_version:
        description: "Chafa version to build"
        required: true
        default: "1.18"

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSYS2 & install toolchains
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pcre2 mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-gettext mingw-w64-x86_64-libffi
            make autoconf automake libtool pkg-config git

      - name: Build Windows ${{ matrix.arch }}
        shell: msys2 {0}
        run: |
          # Convert -lFOO to -Wl,/mingw64/lib/libFOO.a when a static archive exists,
          # keeping Windows system libs (ws2_32, ole32, etc.) dynamic since they
          # have no static archives. The -Wl, prefix is critical: libtool strips
          # bare .a paths from shared library link commands, but passes -Wl, flags
          # through to the linker unchanged, so GLib symbols get embedded in the DLL.
          GLIB_STATIC=""
          for lib in $(pkg-config --libs-only-l --static glib-2.0); do
            name="${lib#-l}"
            path="/mingw64/lib/lib${name}.a"
            if [ -f "$path" ]; then
              GLIB_STATIC="$GLIB_STATIC -Wl,$path"
            else
              GLIB_STATIC="$GLIB_STATIC $lib"
            fi
          done
          # libintl.a has a transitive dep on libiconv not listed by glib-2.0's pkg-config
          if [ -f "/mingw64/lib/libiconv.a" ]; then
            GLIB_STATIC="$GLIB_STATIC -Wl,/mingw64/lib/libiconv.a"
          fi
          # -DGLIB_STATIC_COMPILATION drops __declspec(dllimport) from GLib headers
          # so symbol names in the .o files match the static archive (g_free not __imp_g_free)
          export GLIB_CFLAGS="$(pkg-config --cflags glib-2.0) -DGLIB_STATIC_COMPILATION -DPCRE2_STATIC"
          export GLIB_LIBS="$GLIB_STATIC"
          make libs/windows_amd64/libchafa.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: libs/windows_amd64/

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, 386]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross-compilation tools
        run: |
          sudo apt update
          sudo apt install -y \
            autotools-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            libglib2.0-dev

          case "${{ matrix.arch }}" in
            amd64)
              ;;
            # arm64)
            #   sudo dpkg --add-architecture armhf
            #   sudo dpkg --add-architecture arm64
            #   sudo apt update
            #   sudo apt install -y gcc-aarch64-linux-gnu libglib2.0-dev:arm64
            #   ;;
            386)
              sudo dpkg --add-architecture i386
              sudo apt update
              sudo apt install -y gcc-multilib libc6-dev-i386 libglib2.0-dev:i386
              ;;
          esac

      - name: Build Linux ${{ matrix.arch }}
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              make libs/linux_amd64/libchafa.so
              ;;
            # arm64)
            #   make libs/linux_arm64/libchafa.so
            #   ;;
            386)
              make libs/linux_386/libchafa.so
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: libs/linux_${{ matrix.arch }}/

  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config

      - name: Setup GNU tools for autotools
        run: |
          # Create symlinks so autotools can find GNU libtool
          sudo ln -sf $(brew --prefix)/bin/glibtool /usr/local/bin/libtool
          sudo ln -sf $(brew --prefix)/bin/glibtoolize /usr/local/bin/libtoolize
          # Add to PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Build Darwin ${{ matrix.arch }}
        run: |
          case "${{ matrix.arch }}" in
            arm64)
              make libs/darwin_arm64/libchafa.dylib
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.arch }}
          path: libs/darwin_${{ matrix.arch }}/

  combine-and-commit:
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize binaries
        run: |
          mkdir -p libs/
          cp -r artifacts/. libs/

      - name: Generate checksums and build info
        run: |
          find libs/ -name "*.so" -o -name "*.dylib" -o -name "*.dll" | xargs sha256sum > libs/CHECKSUMS.txt
          echo "Chafa Version: ${{ github.event.inputs.chafa_version || '1.18' }}" > libs/BUILD_INFO.txt
          echo "Build Date: $(date)" >> libs/BUILD_INFO.txt
          echo "Workflow: ${{ github.run_id }}" >> libs/BUILD_INFO.txt

      - name: Commit binaries
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add libs/
          git diff --staged --quiet || git commit -m "[skip ci] Generate binaries"
          git push
